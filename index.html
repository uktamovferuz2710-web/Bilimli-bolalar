<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilimlar Portali — Bosqichma-bosqich Ta'lim va XP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- HEADER & USER STATS -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Bilimlar Portali</h1>
                <p class="text-sm text-blue-200">15 ta fan bo'yicha bosqichma-bosqich testlar va XP reytingi</p>
            </div>
            
            <div class="flex items-center gap-4 bg-blue-800 px-4 py-2 rounded-xl shadow-inner">
                <div>
                    <span id="userNameDisplay" class="font-semibold block">Mehmon</span>
                    <span class="text-xs text-yellow-300 font-bold" id="userXpDisplay">XP: 0</span>
                </div>
                <button onclick="openAuthModal()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-semibold px-3 py-1.5 rounded-lg text-sm transition">Kirish / Profil</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- SEARCH & LEADERBOARD BUTTON -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" id="searchInput" placeholder="Fanni qidiring (masalan: Fizika, Tarix)..." 
                class="flex-grow px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm"
                onkeyup="searchSubjects()">
            <button onclick="openLeaderboard()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                🏆 Global Reyting (XP)
            </button>
        </div>

        <!-- SUBJECTS GRID -->
        <div id="subjectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JavaScript orqali fanlar chiqariladi -->
        </div>
    </main>

    <!-- MODAL (DETAILS, VIDEO, MULTI-LEVEL QUIZ) -->
    <div id="subjectModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 id="modalTitle" class="text-2xl font-bold text-blue-900 mb-2"></h2>
            <p id="modalDesc" class="text-slate-600 mb-4"></p>
            
            <!-- Video dars bo'limi -->
            <div class="mb-6">
                <h3 class="font-semibold text-lg text-blue-800 mb-2">📺 Video Dars</h3>
                <div class="aspect-w-16 aspect-h-9 bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center text-white min-h-[200px]">
                    <iframe id="modalVideo" class="w-full h-64 rounded-xl" src="" title="Video dars" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Bosqichma-bosqich Test bo'limi -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <div class="flex justify-between items-center mb-2">
                    <h3 id="quizLevelTitle" class="font-semibold text-lg text-blue-800">✍️ Bosqichli Testlar</h3>
                    <span id="quizScoreBadge" class="text-xs bg-blue-200 text-blue-800 font-bold px-2 py-1 rounded-md">Savol 1 / 3</span>
                </div>
                <p id="quizQuestion" class="font-medium text-slate-700 mb-3"></p>
                <div id="quizOptions" class="space-y-2"></div>
                <p id="quizResult" class="mt-3 font-semibold text-sm"></p>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 class="text-xl font-bold text-blue-900 mb-4">Profilga kirish</h2>
            <input type="text" id="usernameInput" placeholder="Ismingizni kiriting..." class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <button onclick="saveUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Saqlash va Boshlash</button>
        </div>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div id="leaderboardModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeLeaderboard()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 class="text-2xl font-bold text-blue-900 mb-4 text-center">🏆 Dunyo bo'yicha XP Reytingi</h2>
            <ul id="leaderboardList" class="space-y-2"></ul>
        </div>
    </div>

    <script>
        // Har bir fanda oson, o'rta va qiyin darajadagi ko'p savollar bazasi
        const subjects = [
            {
                id: 1, name: "1. Matematika", desc: "Sonlar, tuzilmalar, fazo va o'zgarishlar haqidagi aniq fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "2 + 2 * 2 nechiga teng?", options: ["6", "8", "4"], correct: "6", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "100 ning 15% qismiga teng?", options: ["10", "15", "20"], correct: "15", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Kvadratning yuzi 64 ga teng bo'lsa, uning tomoni nechiga teng?", options: ["6", "8", "16"], correct: "8", xp: 60 }
                ]
            },
            {
                id: 2, name: "2. Fizika", desc: "Tabiatning umumiy qonunlari, materiya va energiya haqidagi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Tezlik formulasini toping?", options: ["S = v * t", "F = m * a", "E = mc^2"], correct: "S = v * t", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Bosimning birligi nima?", options: ["Nyuton", "Paskal", "Joul"], correct: "Paskal", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Erkin tushish tezlanishi (g) taxminan nechiga teng?", options: ["9.8 m/s²", "5.2 m/s²", "10.5 m/s²"], correct: "9.8 m/s²", xp: 60 }
                ]
            },
            {
                id: 3, name: "3. Kimyo", desc: "Moddalarning tarkibi, tuzilishi, xossalari va o'zgarishlarini o'rganadi.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Suvning kimyoviy formulasi qanday?", options: ["CO2", "H2O", "O2"], correct: "H2O", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Mendeleyev jadvalida Kislorod nechta raqam ostida?", options: ["6", "8", "12"], correct: "8", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Osh tuzining kimyoviy nomi qanday?", options: ["Natriy xlorid", "Kaliy permanganat", "Kalsiy karbonat"], correct: "Natriy xlorid", xp: 60 }
                ]
            },
            {
                id: 4, name: "4. Biologiya", desc: "Tiriklik va barcha tirik organizmlarning hayot faoliyati haqidagi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Inson tanasidagi asosiy qon haydovchi organ?", options: ["Yurak", "O'pka", "Buyrak"], correct: "Yurak", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "O'simliklar quyosh nuri yordamida qanday jarayon hosil qiladi?", options: ["Fotosintez", "Nafas olish", "Ekish"], correct: "Fotosintez", xp: 40 },

                quizzes: [

                    { level: "2-bosqich (O'rta)", q: "Kompyuterning 'miyasi' nima deb ataladi?", options: ["RAM", "Protsessor (CPU)", "Qattiq disk"], correct: "Protsessor (CPU)", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "1 Bayt necha Bitdan iborat?", options: ["8", "16", "1024"], correct: "8", xp: 60 }
                ]
            },
            {
                id: 6, name: "6. Tarix", desc: "Insoniyatning o'tmishi, sivilizatsiyalar rivojlanishi va tarixiy voqealar.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Amir Temur qaysi yilda tug'ilgan?", options: ["1336", "1405", "1219"], correct: "1336", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Buyuk Ipak yo'li qaysi qit'alarni bog'lagan?", options: ["Osiyo va Yevropa", "Afrika va Amerika", "Avstraliya va Antarktida"], correct: "Osiyo va Yevropa", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Ulug'bek akademiyasi qaysi shaharda barpo etilgan?", options: ["Samarqand", "Buxoro", "Xiva"], correct: "Samarqand", xp: 60 }
                ]
            },
            {
                id: 7, name: "7. Geografiya", desc: "Yer yuzasi tabiatini, aholisini va xo'jalik faoliyatini o'rganuvchi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Eng katta okean qaysi?", options: ["Tinch okeani", "Atlantika", "Hind okeani"], correct: "Tinch okeani", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Dunyodagi eng uzun daryo qaysi?", options: ["Nil", "Amazonka", "Sirdaryo"], correct: "Nil", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Yer yuzidagi eng baland cho'qqi qaysi?", options: ["Everest", "Chogori", "Elbrus"], correct: "Everest", xp: 60 }
                ]
            },
            {
                id: 8, name: "8. Ona tili", desc: "Tilning grammatik qurilishi, imlo qoidalari va nutq madaniyati.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "O'zbek alifbosida nechta harf bor?", options: ["26", "29", "34"], correct: "29", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Quyidagilardan qaysi biri unli harf?", options: ["B", "O", "T"], correct: "O", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Bosh kelishikdagi so'z qaysi savolga javob beradi?", options: ["Kim? Nima?", "Kimni? Nimani?", "Kimga? Nimaga?"], correct: "Kim? Nima?", xp: 60 }
                ]
            },
            {
                id: 9, name: "9. Adabiyot", desc: "So'z san'ati, badiiy asarlar tahlili va adabiyot tarixi.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "'O'tkan kunlar' romanining muallifi kim?", options: ["Abdulla Qodiriy", "Alisher Navoiy", "Cho'lpon"], correct: "Abdulla Qodiriy", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "'Xamsa' asari nechta dostondan iborat?", options: ["5", "4", "7"], correct: "5", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Bobur Mirzo qaysi mashhur asarning muallifi?", options: ["Boburnoma", "Qutadg'u bilig", "Muhokamat ul-lug'atayn"], correct: "Boburnoma", xp: 60 }
                ]
            },
            {
                id: 10, name: "10. Ingliz tili", desc: "Xalqaro muloqot, ilm-fan va texnologiyalar tili.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "'Hello' so'zining ma'nosi?", options: ["Salom", "Xayr", "Rahmat"], correct: "Salom", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "'To be' fe'lining 'he' olmoshi uchun shakli?", options: ["is", "are", "am"], correct: "is", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "'Went' fe'li qaysi zamon va fe'lning shakli?", options: ["Go fe'lining o'tgan zamon shakli", "Kelasi zamon", "Hozirgi davom et humanidad"], correct: "Go fe'lining o'tgan zamon shakli", xp: 60 }
                ]
            },
            {
                id: 11, name: "11. Astronomiya", desc: "Osmon jismlari, yulduzlar, sayyoralar va koinot tuzilishi haqidagi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Quyosh sistemasidagi eng katta sayyora?", options: ["Yupiter", "Yer", "Mars"], correct: "Yupiter", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Qaysi sayyora 'Qizil sayyora' deb ataladi?", options: ["Mars", "Venera", "Saturn"], correct: "Mars", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Yerga eng yaqin yulduz qaysi?", options: ["Quyosh", "Sirius", "Polaris"], correct: "Quyosh", xp: 60 }
                ]
            },
            {
                id: 12, name: "12. Iqtisodiyot", desc: "Cheklangan resurslardan samarali foydalanish va bozor qonunlari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "O'zbekiston milliy valyutasi?", options: ["So'm", "Dollar", "Yevro"], correct: "So'm", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Inflatsiya nima?", options: ["Pul qadrsizlanishi", "Daromad oshishi", "Soliq kamayishi"], correct: "Pul qadrsizlanishi", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Monopoliya nima?", options: ["Bozorda bitta sotuvchi hukmronligi", "Ko'plab raqobat", "Davlat byudjeti"], correct: "Bozorda bitta sotuvchi hukmronligi", xp: 60 }
                ]
            },
            {
                id: 13, name: "13. Huquqshunoslik", desc: "Jamiyatdagi huquqiy normalar, qonunlar va inson huquqlari asoslari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "O'zbekiston Respublikasining Asosiy qonuni?", options: ["Konstitutsiya", "Jinoyat kodeksi", "Mehnat kodeksi"], correct: "Konstitutsiya", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "O'zbekistonda fuqarolar necha yoshdan ovoz berish huquqiga ega?", options: ["18 yoshdan", "16 yoshdan", "21 yoshdan"], correct: "18 yoshdan", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "O'zbekiston Respublikasining Konstitutsiyasi qabul qilingan sana?", options: ["1992-yil 8-dekabr", "1991-yil 1-sentabr", "1993-yil 2-iyul"], correct: "1992-yil 8-dekabr", xp: 60 }
                ]
            },
            {
                id: 14, name: "14. Falsafa", desc: "Borliq, bilim, axloq va inson tafakkurining umumiy tamoyillari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Falsafa so'zining ma'nosi?", options: ["Donishmandlikni sevish", "Matematik qonun", "Tarixiy sana"], correct: "Donishmandlikni sevish", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "'Men o'ylayapman, demak, men yashayapman' degan faylasuf kim?", options: ["Rene Dekart", "Aristotel", "Platon"], correct: "Rene Dekart", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Antik davr yunon faylasufi Sokratning o'quvchisi kim bo'lgan?", options: ["Platon", "Pifagor", "Arximed"], correct: "Platon", xp: 60 }
                ]
            },
            {
                id: 15, name: "15. Psixologiya", desc: "Inson ruhiyati, xulq-atvori va ichki kechinmalarini o'rganuvchi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                quizzes: [
                    { level: "1-bosqich (Oson)", q: "Psixologiya nimani o'rganadi?", options: ["Ruhiyatni", "Toshlarni", "Mashinalarni"], correct: "Ruhiyatni", xp: 20 },
                    { level: "2-bosqich (O'rta)", q: "Inson fe'l-atvorining 4 ta asosiy asosiy turi kim tomonidan e'tirof etilgan?", options: ["Gippokrat", "Freyd", "Pavlov"], correct: "Gippokrat", xp: 40 },
                    { level: "3-bosqich (Qiyin)", q: "Psychoanalysis (Psixoanaliz) asoschisi kim?", options: ["Zigmunt Freyd", "Karl Jung", "Jon Uotson"], correct: "Zigmunt Freyd", xp: 60 }
                ]
            }
        ];

        let currentUser = localStorage.getItem("portal_user") || "Mehmon";
        let currentXp = parseInt(localStorage.getItem("portal_xp")) || 0;
        let activeSubject = null;
        let currentQuizIndex = 0;

        function updateUI() {
            document.getElementById("userNameDisplay").innerText = currentUser;
            document.getElementById("userXpDisplay").innerText = "XP: " + currentXp;
        }

        function renderSubjects(list) {
            const grid = document.getElementById("subjectsGrid");
            grid.innerHTML = "";
            list.forEach(subj => {
                grid.innerHTML += `
                    <div onclick="openModal(${subj.id})" class="bg-white p-6 rounded-2xl shadow-md hover:shadow-xl transition cursor-pointer border border-slate-200 hover:border-blue-500 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-blue-900 mb-2">${subj.name}</h3>
                            <p class="text-slate-600 text-sm mb-4">${subj.desc}</p>
                            <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-1 rounded-md">⭐ 3 ta bosqichli test</span>
                        </div>
                        <span class="mt-4 text-blue-600 font-semibold text-sm flex items-center gap-1">Darsni boshlash →</span>
                    </div>
                `;
            });
        }

        function searchSubjects() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = subjects.filter(s => s.name.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query));
            renderSubjects(filtered);
        }

        function openModal(id) {
            activeSubject = subjects.find(s => s.id === id);
            currentQuizIndex = 0;
            
            document.getElementById("modalTitle").innerText = activeSubject.name;
            document.getElementById("modalDesc").innerText = activeSubject.desc;
            document.getElementById("modalVideo").src = activeSubject.video;
            
            loadQuizStep();

            document.getElementById("subjectModal").classList.remove("hidden");
            document.getElementById("subjectModal").classList.add("flex");
        }

        function loadQuizStep() {
            const quiz = activeSubject.quizzes[currentQuizIndex];
            document.getElementById("quizLevelTitle").innerText = `✍️ ${quiz.level} (+${quiz.xp} XP)`;
            document.getElementById("quizScoreBadge").innerText = `Savol ${currentQuizIndex + 1} / ${activeSubject.quizzes.length}`;
            document.getElementById("quizQuestion").innerText = quiz.q;
            
            const optionsDiv = document.getElementById("quizOptions");
            optionsDiv.innerHTML = "";
            document.getElementById("quizResult").innerText = "";

            quiz.options.forEach(opt => {
                optionsDiv.innerHTML += `<button onclick="checkAnswer('${opt}', '${quiz.correct}', ${quiz.xp})" class="w-full text-left bg-white p-2.5 rounded-lg border hover:bg-blue-100 transition font-medium">${opt}</button>`;
            });
        }

        function closeModal() {
            document.getElementById("subjectModal").classList.remove("flex");
            document.getElementById("subjectModal").classList.add("hidden");
            document.getElementById("modalVideo").src = "";
        }

        function checkAnswer(selected, correct, xpReward) {
            const resultEl = document.getElementById("quizResult");
            if(selected === correct) {
                currentXp += xpReward;
                localStorage.setItem("portal_xp", currentXp);
                updateUI();

                if(currentQuizIndex < activeSubject.quizzes.length - 1) {
                    resultEl.innerHTML = `✅ To'g'ri! +${xpReward} XP. Keyingi bosqichga o'tilmoqda...`;
                    resultEl.className = "mt-3 font-semibold text-sm text-green-600";
                    setTimeout(() => {
                        currentQuizIndex++;
                        loadQuizStep();
                    }, 1200);
                } else {
                    resultEl.innerHTML = `🎉 Tabriklayman! Siz bu fanning barcha bosqichlarini muvaffaqiyatli yakunladingiz!`;
                    resultEl.className = "mt-3 font-semibold text-sm text-green-600";
                }
            } else {
                resultEl.innerText = "❌ Xato javob, qayta urinib ko'ring!";
                resultEl.className = "mt-3 font-semibold text-sm text-red-600";
            }
        }

        function openAuthModal() {
            document.getElementById("authModal").classList.remove("hidden");
            document.getElementById("authModal").classList.add("flex");
        }

        function closeAuthModal() {
            document.getElementById("authModal").classList.remove("flex");
            document.getElementById("authModal").classList.add("hidden");
        }

        function saveUser() {
            const name = document.getElementById("usernameInput").value.trim();
            if(name) {
                currentUser = name;
                localStorage.setItem("portal_user", currentUser);
                updateUI();
                closeAuthModal();
            }
        }

        function openLeaderboard() {
            const list = document.getElementById("leaderboardList");
            const players = [
                { name: currentUser, xp: currentXp },
                { name: "Azizbek", xp: 450 },
                { name: "Madina", xp: 380 },
                { name: "Jasur", xp: 300 },
                { name: "Feruza", xp: 150 }
            ].sort((a,b) => b.xp - a.xp);

            list.innerHTML = "";
            players.forEach((p, index) => {
                list.innerHTML += `<li class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border font-medium"><span>${index + 1}. ${p.name}</span><span class="text-blue-600 font-bold">${p.xp} XP</span></li>`;
            });

            document.getElementById("leaderboardModal").classList.remove("hidden");
            document.getElementById("leaderboardModal").classList.add("flex");
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardModal").classList.remove("flex");
            document.getElementById("leaderboardModal").classList.add("hidden");
        }

        updateUI();
        renderSubjects(subjects);
    </script>
</body>
</html>
