<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilimlar Portali — Ta'lim va Reyting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- HEADER & USER STATS -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Bilimlar Portali</h1>
                <p class="text-sm text-blue-200">15 ta asosiy fan bo'yicha ta'lim va XP reytingi</p>
            </div>
            
            <div class="flex items-center gap-4 bg-blue-800 px-4 py-2 rounded-xl shadow-inner">
                <div>
                    <span id="userNameDisplay" class="font-semibold block">Mehmon</span>
                    <span class="text-xs text-yellow-300 font-bold" id="userXpDisplay">XP: 0</span>
                </div>
                <button onclick="openAuthModal()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-semibold px-3 py-1.5 rounded-lg text-sm transition">Kirish / Profil</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- SEARCH & LEADERBOARD BUTTON -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" id="searchInput" placeholder="Fanni qidiring (masalan: Fizika, Tarix)..." 
                class="flex-grow px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm"
                onkeyup="searchSubjects()">
            <button onclick="openLeaderboard()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                🏆 Global Reyting (XP)
            </button>
        </div>

        <!-- SUBJECTS GRID -->
        <div id="subjectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JavaScript orqali fanlar chiqariladi -->
        </div>
    </main>

    <!-- MODAL (DETAILS, VIDEO, QUIZ) -->
    <div id="subjectModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 id="modalTitle" class="text-2xl font-bold text-blue-900 mb-2"></h2>
            <p id="modalDesc" class="text-slate-600 mb-4"></p>
            
            <!-- Video dars bo'limi -->
            <div class="mb-6">
                <h3 class="font-semibold text-lg text-blue-800 mb-2">📺 Video Dars</h3>
                <div class="aspect-w-16 aspect-h-9 bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center text-white min-h-[200px]">
                    <iframe id="modalVideo" class="w-full h-64 rounded-xl" src="" title="Video dars" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Test / Misol bo'limi -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <h3 class="font-semibold text-lg text-blue-800 mb-2">✍️ Mini Test (To'g'ri javob uchun +50 XP)</h3>
                <p id="quizQuestion" class="font-medium text-slate-700 mb-3"></p>
                <div id="quizOptions" class="space-y-2"></div>
                <p id="quizResult" class="mt-3 font-semibold text-sm"></p>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 class="text-xl font-bold text-blue-900 mb-4">Profilga kirish</h2>
            <input type="text" id="usernameInput" placeholder="Ismingizni kiriting..." class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <button onclick="saveUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Saqlash va Boshlash</button>
        </div>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div id="leaderboardModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeLeaderboard()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 class="text-2xl font-bold text-blue-900 mb-4 text-center">🏆 Dunyo bo'yicha XP Reytingi</h2>
            <ul id="leaderboardList" class="space-y-2">
                <!-- Reyting o'yinchilari -->
            </ul>
        </div>
    </div>

    <script>
        const subjects = [
            { id: 1, name: "1. Matematika", desc: "Sonlar, tuzilmalar, fazo va o'zgarishlar haqidagi aniq fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "2 + 2 * 2 nechiga teng?", options: ["6", "8", "4"], correct: "6" } },
            { id: 2, name: "2. Fizika", desc: "Tabiatning umumiy qonunlari, materiya va energiya haqidagi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Tezlik formulasini toping?", options: ["S = v * t", "F = m * a", "E = mc^2"], correct: "S = v * t" } },
            { id: 3, name: "3. Kimyo", desc: "Moddalarning tarkibi, tuzilishi, xossalari va o'zgarishlarini o'rganadi.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Suvning kimyoviy formulasi qanday?", options: ["CO2", "H2O", "O2"], correct: "H2O" } },
            { id: 4, name: "4. Biologiya", desc: "Tiriklik va barcha tirik organizmlarning hayot faoliyati haqidagi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Inson tanasidagi asosiy organ qaysi?", options: ["Yurak", "Tosh", "Temir"], correct: "Yurak" } },
            { id: 5, name: "5. Informatika", desc: "Axborotni kompyuterlar yordamida qayta ishlash va dasturlash asoslari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "HTML nima?", options: ["Dasturlash tili", "Belgilash tili", "Brauzer"], correct: "Belgilash tili" } },
            { id: 6, name: "6. Tarix", desc: "Insoniyatning o'tmishi, sivilizatsiyalar rivojlanishi va tarixiy voqealar.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Amir Temur qaysi yilda tug'ilgan?", options: ["1336", "1405", "1219"], correct: "1336" } },
            { id: 7, name: "7. Geografiya", desc: "Yer yuzasi tabiatini, aholisini va xo'jalik faoliyatini o'rganuvchi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Eng katta okean qaysi?", options: ["Tinch okeani", "Atlantika", "Hind okeani"], correct: "Tinch okeani" } },
            { id: 8, name: "8. Ona tili", desc: "Tilning grammatik qurilishi, imlo qoidalari va nutq madaniyati.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "O'zbek alifbosida nechta harf bor?", options: ["26", "29", "34"], correct: "29" } },
            { id: 9, name: "9. Adabiyot", desc: "So'z san'ati, badiiy asarlar tahlili va adabiyot tarixi.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "'O'tkan kunlar' romanining muallifi kim?", options: ["Alisher Navoiy", "Abdulla Qodiriy", "Cho'lpon"], correct: "Abdulla Qodiriy" } },
            { id: 10, name: "10. Ingliz tili", desc: "Xalqaro muloqot, ilm-fan va texnologiyalar tili.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "'Hello' so'zining ma'nosi?", options: ["Xayr", "Salom", "Rahmat"], correct: "Salom" } },
            { id: 11, name: "11. Astronomiya", desc: "Osmon jismlari, yulduzlar, sayyoralar va koinot tuzilishi haqidagi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Quyosh sistemasidagi eng katta sayyora?", options: ["Yer", "Mars", "Yupiter"], correct: "Yupiter" } },
            { id: 12, name: "12. Iqtisodiyot", desc: "Cheklangan resurslardan samarali foydalanish va bozor qonunlari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "O'zbekiston milliy valyutasi?", options: ["Dollar", "So'm", "Yevro"], correct: "So'm" } },
            { id: 13, name: "13. Huquqshunoslik", desc: "Jamiyatdagi huquqiy normalar, qonunlar va inson huquqlari asoslari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "O'zbekiston Respublikasining Asosiy qonuni?", options: ["Konstitutsiya", "Jinoyat kodeksi", "Mehnat kodeksi"], correct: "Konstitutsiya" } },
            { id: 14, name: "14. Falsafa", desc: "Borliq, bilim, axloq va inson tafakkurining umumiy tamoyillari.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Falsafa so'zining ma'nosi?", options: ["Donishmandlikni sevish", "Matematika", "Tarix o'qish"], correct: "Donishmandlikni sevish" } },
            { id: 15, name: "15. Psixologiya", desc: "Inson ruhiyati, xulq-atvori va ichki kechinmalarini o'rganuvchi fan.", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: { q: "Psixologiya nimani o'rganadi?", options: ["Mashinalarni", "Ruhiyatni", "Toshlarni"], correct: "Ruhiyatni" } }
        ];

        let currentUser = localStorage.getItem("portal_user") || "Mehmon";
        let currentXp = parseInt(localStorage.getItem("portal_xp")) || 0;

        function updateUI() {
            document.getElementById("userNameDisplay").innerText = currentUser;
            document.getElementById("userXpDisplay").innerText = "XP: " + currentXp;
        }

        function renderSubjects(list) {
            const grid = document.getElementById("subjectsGrid");
            grid.innerHTML = "";
            list.forEach(subj => {
                grid.innerHTML += `
                    <div onclick="openModal(${subj.id})" class="bg-white p-6 rounded-2xl shadow-md hover:shadow-xl transition cursor-pointer border border-slate-200 hover:border-blue-500 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-blue-900 mb-2">${subj.name}</h3>
                            <p class="text-slate-600 text-sm">${subj.desc}</p>
                        </div>
                        <span class="mt-4 text-blue-600 font-semibold text-sm flex items-center gap-1">Darsni boshlash →</span>
                    </div>
                `;
            });
        }

        function searchSubjects() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = subjects.filter(s => s.name.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query));
            renderSubjects(filtered);
        }

        function openModal(id) {
            const subj = subjects.find(s => s.id === id);
            document.getElementById("modalTitle").innerText = subj.name;
            document.getElementById("modalDesc").innerText = subj.desc;
            document.getElementById("modalVideo").src = subj.video;
            
            // Quiz setup
            document.getElementById("quizQuestion").innerText = subj.quiz.q;
            const optionsDiv = document.getElementById("quizOptions");
            optionsDiv.innerHTML = "";
            document.getElementById("quizResult").innerText = "";

            subj.quiz.options.forEach(opt => {
                optionsDiv.innerHTML += `<button onclick="checkAnswer('${opt}', '${subj.quiz.correct}')" class="w-full text-left bg-white p-2.5 rounded-lg border hover:bg-blue-100 transition font-medium">${opt}</button>`;
            });

            document.getElementById("subjectModal").classList.remove("hidden");
            document.getElementById("subjectModal").classList.add("flex");
        }

        function closeModal() {
            document.getElementById("subjectModal").classList.remove("flex");
            document.getElementById("subjectModal").classList.add("hidden");
            document.getElementById("modalVideo").src = "";
        }

        function checkAnswer(selected, correct) {
            const resultEl = document.getElementById("quizResult");
            if(selected === correct) {
                resultEl.innerText = "✅ To'g'ri! +50 XP qo'shildi!";
                resultEl.className = "mt-3 font-semibold text-sm text-green-600";
                currentXp += 50;
                localStorage.setItem("portal_xp", currentXp);
                updateUI();
            } else {
                resultEl.innerText = "❌ Xato, qayta urinib ko'ring!";
                resultEl.className = "mt-3 font-semibold text-sm text-red-600";
            }
        }

        function openAuthModal() {
            document.getElementById("authModal").classList.remove("hidden");
            document.getElementById("authModal").classList.add("flex");
        }

        function closeAuthModal() {
            document.getElementById("authModal").classList.remove("hidden");
            document.getElementById("authModal").classList.add("hidden");
            document.getElementById("authModal").classList.remove("flex");
        }

        function saveUser() {
            const name = document.getElementById("usernameInput").value.trim();
            if(name) {
                currentUser = name;
                localStorage.setItem("portal_user", currentUser);
                updateUI();
                closeAuthModal();
            }
        }

        function openLeaderboard() {
            const list = document.getElementById("leaderboardList");
            // Dummy global players + current user
            const players = [
                { name: currentUser, xp: currentXp },
                { name: "Azizbek", xp: 450 },
                { name: "Madina", xp: 380 },
                { name: "Jasur", xp: 300 },
                { name: "Feruza", xp: 150 }
            ].sort((a,b) => b.xp - a.xp);

            list.innerHTML = "";
            players.forEach((p, index) => {
                list.innerHTML += `<li class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border font-medium"><span>${index + 1}. ${p.name}</span><span class="text-blue-600 font-bold">${p.xp} XP</span></li>`;
            });

            document.getElementById("leaderboardModal").classList.remove("hidden");
            document.getElementById("leaderboardModal").classList.add("flex");
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardModal").classList.remove("flex");
            document.getElementById("leaderboardModal").classList.add("hidden");
        }

        updateUI();
        renderSubjects(subjects);
    </script>
</body>
</html>
