<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilimlar Portali — Cheksiz Testlar va XP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- HEADER & USER STATS -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Bilimlar Portali ∞</h1>
                <p class="text-sm text-blue-200">15 ta fan • Cheksiz savollar • Borgan sari qiyinlashuvchi tizim</p>
            </div>
            
            <div class="flex items-center gap-4 bg-blue-800 px-4 py-2 rounded-xl shadow-inner">
                <div>
                    <span id="userNameDisplay" class="font-semibold block">Mehmon</span>
                    <span class="text-xs text-yellow-300 font-bold" id="userXpDisplay">XP: 0</span>
                </div>
                <button onclick="openAuthModal()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-semibold px-3 py-1.5 rounded-lg text-sm transition">Kirish / Profil</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- SEARCH & LEADERBOARD BUTTON -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" id="searchInput" placeholder="Fanni qidiring (masalan: Matematika, Ingliz tili)..." 
                class="flex-grow px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm"
                onkeyup="searchSubjects()">
            <button onclick="openLeaderboard()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                🏆 Global Reyting (XP)
            </button>
        </div>

        <!-- SUBJECTS GRID -->
        <div id="subjectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- MODAL (DETAILS, VIDEO, INFINITE QUIZ) -->
    <div id="subjectModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 id="modalTitle" class="text-2xl font-bold text-blue-900 mb-1"></h2>
            <p id="modalDesc" class="text-slate-600 text-sm mb-4"></p>
            
            <!-- Video dars bo'limi -->
            <div class="mb-5">
                <h3 class="font-semibold text-base text-blue-800 mb-2">📺 Video Dars</h3>
                <div class="bg-slate-900 rounded-xl overflow-hidden">
                    <iframe id="modalVideo" class="w-full h-56 rounded-xl" src="" title="Video dars" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Cheksiz Test bo'limi -->
            <div class="bg-blue-50 p-5 rounded-xl border border-blue-200">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                    <span id="levelBadge" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">Daraja (Level): 1</span>
                    <span id="questionCounter" class="text-xs bg-blue-200 text-blue-900 font-bold px-3 py-1 rounded-full">Savol #1 • ∞ cheksiz</span>
                    <span id="xpRewardBadge" class="text-xs bg-green-200 text-green-900 font-bold px-3 py-1 rounded-full">+20 XP</span>
                </div>
                
                <p id="quizQuestion" class="font-bold text-lg text-slate-800 mb-4"></p>
                <div id="quizOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
                <p id="quizResult" class="mt-3 font-semibold text-sm min-h-[20px]"></p>
            </div>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 class="text-xl font-bold text-blue-900 mb-4">Profilga kirish</h2>
            <input type="text" id="usernameInput" placeholder="Ismingizni kiriting..." class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <button onclick="saveUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Saqlash va Boshlash</button>
        </div>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div id="leaderboardModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeLeaderboard()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h2 class="text-2xl font-bold text-blue-900 mb-4 text-center">🏆 Dunyo bo'yicha XP Reytingi</h2>
            <ul id="leaderboardList" class="space-y-2"></ul>
        </div>
    </div>

                { q: "Alisher Navoiy qaysi yilda tug'ilgan?", a: "1441-yil", w: ["1483-yil", "1336-yil", "1501-yil"] },
                { q: "Zahiriddin Muhammad Bobur qaysi yilda tug'ilgan?", a: "1483-yil", w: ["1441-yil", "1526-yil", "1394-yil"] },

                { q: "Mantiq fanining asoschisi deb kim tan olingan?", a: "Arastu (Aristotel)", w: ["Demokrit", "Geraklit", "Epikur"] },
                { q: "Borliq va bilishning eng umumiy qonunlarini o'rganuvchi fan?", a: "Falsafa", w: ["Sotsiologiya", "Psixologiya", "Tarix"] }
            ],
            15: [ // Psixologiya
                { q: "Tez jahli chiqadigan, lekin tez hovridan tushadigan temperament turi?", a: "Xolerik", w: ["Sangvinik", "Flegmatik", "Melanxolik"] },
                { q: "Og'ir-bosiq, shoshilmaydigan temperament turi qaysi?", a: "Flegmatik", w: ["Xolerik", "Sangvinik", "Melanxolik"] },
                { q: "Quvnoq, kirishimli va faol temperament turi qaysi?", a: "Sangvinik", w: ["Melanxolik", "Flegmatik", "Xolerik"] }
            ]
        };

        let currentUser = localStorage.getItem("portal_user") || "Mehmon";
        let currentXp = parseInt(localStorage.getItem("portal_xp")) || 0;
        let activeSubject = null;
        let questionCount = 1;
        let currentLevel = 1;
        let currentCorrectAnswer = "";
        let currentXpReward = 20;

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // CHEKSIZ VA QIYINLASHIB BORUVCHI SAVOL GENERATORI
        function generateInfiniteQuestion(subjectId, level) {
            let q = "", correct = "", options = [];

            // 1. MATEMATIKA — Darajaga qarab sonlar va amallar qiyinlashadi!
            if (subjectId === 1) {
                if (level === 1) {
                    let a = rand(5, 30), b = rand(5, 30);
                    q = `${a} + ${b} nechiga teng?`;
                    correct = String(a + b);
                } else if (level === 2) {
                    let a = rand(6, 15), b = rand(6, 15);
                    q = `${a} × ${b} nechiga teng?`;
                    correct = String(a * b);
                } else if (level === 3) {
                    let a = rand(10, 25), b = rand(3, 9), c = rand(5, 20);
                    q = `${a} × ${b} + ${c} nechiga teng?`;
                    correct = String(a * b + c);
                } else if (level === 4) {
                    let x = rand(5, 25), k = rand(3, 8), b = rand(10, 40);
                    let res = k * x + b;
                    q = `Tenglamani yeching: ${k}x + ${b} = ${res}. (x = ?)`;
                    correct = String(x);
                } else {
                    // Level 5 va undan yuqori — cheksiz murakkab kvadrat va foiz misollar!
                    let base = rand(11, 20 + level * 2);
                    let add = rand(15, 50 * level);
                    q = `${base}² + ${add} nechiga teng?`;
                    correct = String(base * base + add);
                }
                let num = Number(correct);
                options = shuffle([correct, String(num + rand(2, 12)), String(num - rand(2, 10)), String(num + rand(13, 25))]);
            }

            // 2. FIZIKA — Tezlik, kuch, energiya va bosim masalalari (cheksiz sonlar bilan)
            else if (subjectId === 2) {
                let type = rand(1, 3);
                if (type === 1) {
                    let v = rand(10, 25 * level), t = rand(2, 10 + level);
                    q = `Jism ${v} m/s tezlik bilan ${t} sekund harakatlandi. U qancha yo'l (metr) bosib o'tgan?`;
                    correct = `${v * t} m`;
                    options = shuffle([correct, `${v * t + 10} m`, `${v + t} m`, `${Math.abs(v * t - 15)} m`]);
                } else if (type === 2) {
                    let m = rand(5, 20 * level), a = rand(2, 10);
                    q = `Massasi ${m} kg bo'lgan jismga ${a} m/s² tezlanish berish uchun qancha kuch (Nyuton) kerak?`;
                    correct = `${m * a} N`;
                    options = shuffle([correct, `${m + a} N`, `${m * a + 20} N`, `${m * 2} N`]);
                } else {
                    let u = rand(10, 50 * level), r = rand(2, 10);
                    let i = u * r;
                    q = `Zanjirdagi tok kuchi ${r} A, qarshilik ${u} Om bo'lsa, kuchlanish necha Volt?`;
                    correct = `${i} V`;
                    options = shuffle([correct, `${i + 12} V`, `${u + r} V`, `${Math.abs(i - 8)} V`]);
                }
            }

            // 5. INFORMATIKA — Ikkilik sanoq sistemasi va axborot o'lchov birliklari (cheksiz!)
            else if (subjectId === 5) {
                if (level <= 2) {
                    let kb = rand(2, 16 * level);
                    q = `${kb} Kilobayt (KB) necha Baytga teng?`;
                    correct = `${kb * 1024} bayt`;
                    options = shuffle([correct, `${kb * 1000} bayt`, `${kb * 512} bayt`, `${kb * 8} bayt`]);
                } else {
                    let dec = rand(10, 30 + level * 15);
                    q = `O'nlik sanoq sistemasidagi ${dec} soni ikkilik sanoq sistemasida qanday yoziladi?`;
                    correct = dec.toString(2);
                    options = shuffle([correct, (dec + 1).toString(2), (dec - 1).toString(2), (dec + 3).toString(2)]);
                }
            }

            // 12. IQTISODIYOT — Foiz, foyda va valyuta hisoblari (cheksiz!)
            else if (subjectId === 12) {
                let sum = rand(10, 50 * level) * 1000;
                let perc = [10, 15, 20, 25, 30][rand(0, 4)];
                let ans = (sum * perc) / 100;
                q = `${sum.toLocaleString()} so'mlik mahsulotga ${perc}% chegirma berilsa, necha so'm tejaladi?`;
                correct = `${ans.toLocaleString()} so'm`;
                options = shuffle([correct, `${(ans + 2000).toLocaleString()} so'm`, `${(ans / 2).toLocaleString()} so'm`, `${(ans + 5000).toLocaleString()} so'm`]);
            }

            // QOLGAN BARCHA FANLAR — Faktlar bazasidan + darajaga qarab aralashtirilgan savollar
            else {
                const bank = factBanks[subjectId];
                const item = bank[rand(0, bank.length - 1)];
                q = `[Daraja ${level}] ${item.q}`;
                correct = item.a;
                options = shuffle([item.a, ...item.w]);
            }

            return { q, correct, options };
        }

        function updateUI() {
            document.getElementById("userNameDisplay").innerText = currentUser;
            document.getElementById("userXpDisplay").innerText = "XP: " + currentXp;
        }

        function renderSubjects(list) {
            const grid = document.getElementById("subjectsGrid");
            grid.innerHTML = "";
            list.forEach(subj => {
                grid.innerHTML += `
                    <div onclick="openModal(${subj.id})" class="bg-white p-6 rounded-2xl shadow-md hover:shadow-xl transition cursor-pointer border border-slate-200 hover:border-blue-500 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-blue-900 mb-2">${subj.name}</h3>
                            <p class="text-slate-600 text-sm mb-4">${subj.desc}</p>
                            <span class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-2.5 py-1 rounded-md">∞ Cheksiz testlar • Level tizimi</span>
                        </div>
                        <span class="mt-4 text-blue-600 font-semibold text-sm flex items-center gap-1">Darsni boshlash →</span>
                    </div>
                `;
            });
        }

        function searchSubjects() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = subjects.filter(s => s.name.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query));
            renderSubjects(filtered);
        }

        function openModal(id) {
            activeSubject = subjects.find(s => s.id === id);
            questionCount = 1;
            currentLevel = 1;
            
            document.getElementById("modalTitle").innerText = activeSubject.name;
            document.getElementById("modalDesc").innerText = activeSubject.desc;
            document.getElementById("modalVideo").src = activeSubject.video;
            
            loadNextInfiniteQuestion();

            document.getElementById("subjectModal").classList.remove("hidden");
            document.getElementById("subjectModal").classList.add("flex");
        }

        function loadNextInfiniteQuestion() {
            // Har 3 ta savolda daraja (Level) oshadi va qiyinlashadi!
            currentLevel = Math.floor((questionCount - 1) / 3) + 1;
            currentXpReward = currentLevel * 20;

            const generated = generateInfiniteQuestion(activeSubject.id, currentLevel);
            currentCorrectAnswer = generated.correct;

            document.getElementById("levelBadge").innerText = `Daraja (Level): ${currentLevel}`;
            document.getElementById("questionCounter").innerText = `Savol #${questionCount} • ∞ cheksiz`;
            document.getElementById("xpRewardBadge").innerText = `+${currentXpReward} XP`;
            document.getElementById("quizQuestion").innerText = generated.q;
            document.getElementById("quizResult").innerText = "";

            const optionsDiv = document.getElementById("quizOptions");
            optionsDiv.innerHTML = "";
            generated.options.forEach(opt => {
                const safeOpt = opt.replace(/'/g, "\\'");
                optionsDiv.innerHTML += `<button onclick="checkAnswer('${safeOpt}')" class="w-full text-left bg-white p-3 rounded-xl border border-slate-200 hover:bg-blue-100 hover:border-blue-400 transition font-medium shadow-sm">${opt}</button>`;
            });
        }

        function checkAnswer(selected) {
            const resultEl = document.getElementById("quizResult");
            if (selected === currentCorrectAnswer) {
                currentXp += currentXpReward;
                localStorage.setItem("portal_xp", currentXp);
                updateUI();

                resultEl.innerHTML = `✅ To'g'ri! +${currentXpReward} XP qo'shildi! Keyingi savol yuklanmoqda...`;
                resultEl.className = "mt-3 font-semibold text-sm text-green-600";
                
                questionCount++;
                setTimeout(() => {
                    loadNextInfiniteQuestion();
                }, 800);
            } else {
                resultEl.innerText = "❌ Xato javob! Qayta urinib ko'ring.";
                resultEl.className = "mt-3 font-semibold text-sm text-red-600";
            }
        }

        function closeModal() {
            document.getElementById("subjectModal").classList.remove("flex");
            document.getElementById("subjectModal").classList.add("hidden");
            document.getElementById("modalVideo").src = "";
        }

        function openAuthModal() {
            document.getElementById("authModal").classList.remove("hidden");
            document.getElementById("authModal").classList.add("flex");
        }

        function closeAuthModal() {
            document.getElementById("authModal").classList.remove("flex");
            document.getElementById("authModal").classList.add("hidden");
        }

        function saveUser() {
            const name = document.getElementById("usernameInput").value.trim();
            if (name) {
                currentUser = name;
                localStorage.setItem("portal_user", currentUser);
                updateUI();
                closeAuthModal();
            }
        }

        function openLeaderboard() {
            const list = document.getElementById("leaderboardList");
            const players = [
                { name: currentUser, xp: currentXp },
                { name: "Azizbek (Uzbekistan)", xp: 1450 },
                { name: "Madina (Uzbekistan)", xp: 980 },
                { name: "Jasur (Kazakhstan)", xp: 640 },
                { name: "Feruza (Uzbekistan)", xp: 320 }
            ].sort((a, b) => b.xp - a.xp);

            list.innerHTML = "";
            players.forEach((p, index) => {
                list.innerHTML += `<li class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border font-medium"><span>${index + 1}. ${p.name}</span><span class="text-blue-600 font-bold">${p.xp} XP</span></li>`;
            });

            document.getElementById("leaderboardModal").classList.remove("hidden");
            document.getElementById("leaderboardModal").classList.add("flex");
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardModal").classList.remove("flex");
            document.getElementById("leaderboardModal").classList.add("hidden");
        }

        updateUI();
        renderSubjects(subjects);
    </script>
</body>
</html>
